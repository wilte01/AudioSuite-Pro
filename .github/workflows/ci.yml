# AudioSuite-Pro continuous integration.
#
# Changed in 1.0.1: test job now runs on windows-latest only (Windows-only
# software), installs ffmpeg via choco for pydub audio export in tests,
# and checks out with fetch-depth: 0 for release notes enumeration.
# Removed ubuntu-latest from test matrix and Linux-specific system
# package installation steps.
# Changed in 1.0.1: simplified workflow header comments.
# Changed in 1.0.1: moved typecheck job to windows-latest (Windows-specific
# code uses Windows-only APIs and types).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  docs-locks:
    name: Docs locks (freshness & formats)
    # Changed in 2.1.0: added this job (PLAN_docs_consolidation D22). The
    # document locks fail on a stale guide artefact, a binary nobody
    # classified, a reintroduced prose format or a generated table that no
    # longer matches its source - but they used to run only inside the full
    # suite, so a stale .docx surfaced 15-20 minutes into a three-interpreter
    # matrix. Running the same files on their own turns that into a couple of
    # minutes, which is early enough to be worth fixing straight away.
    #
    # It adds no check the suite lacks - the same modules run there too - and
    # tests/test_docs_formats.py::TestDocsLocksRunOnTheirOwn keeps this file
    # list honest, so a lock cannot be dropped from the job silently. The
    # install comes from uv.lock rather than a hand-written pip list because
    # the freshness locks compare a committed artefact against what python-docx
    # renders today: an unpinned renderer would red the job for a reason that
    # has nothing to do with the change under test.
    # windows-latest for the same reason the typecheck job moved there: these
    # locks read the real registry (test_readme imports every tool surface), so
    # they exercise Windows-only code and a Linux leg would be a platform
    # nothing else in this repo runs on.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install uv
      - run: uv sync --extra dev
      - name: Documentation locks
        shell: bash
        env:
          PYTHONUTF8: "1"
        # --no-cov keeps this run out of the coverage data: it measures seven
        # lock modules, not the suite, and coverage belongs to the test job.
        # The exit code is not the whole verdict: a run that collected nothing
        # (a renamed module, an empty selection) prints an empty report that
        # reads like success, so the summary is checked too. A skip is also a
        # failure here, on the same rule the instruction-locks step applies -
        # a skipped lock is a lock nobody verified.
        run: |
          log="$(mktemp)"
          set +e
          uv run python -m pytest \
            tests/test_user_guide_hygiene.py \
            tests/test_docs_formats.py \
            tests/test_docs_index.py \
            tests/test_guide_resolution.py \
            tests/test_api_reference.py \
            tests/test_readme.py \
            tests/test_changelog_format.py \
            --no-cov -q > "$log" 2>&1
          code=$?
          set -e
          cat "$log"
          if [ "$code" -ne 0 ]; then
            exit "$code"
          fi
          grep -qE "[0-9]+ passed" "$log" || {
            echo "gate fail: the documentation locks ran nothing" >&2
            exit 1
          }
          if grep -qE "[0-9]+ skipped" "$log"; then
            echo "gate fail: a document lock skipped; a skipped lock is not a verified lock" >&2
            exit 1
          fi
          echo "documentation locks pass"

  typecheck:
    name: Type Check
    # This project targets Windows: mypy's platform selection follows the
    # runner OS, and the suite legitimately uses Windows-only stdlib members
    # (ctypes.windll, os.startfile, subprocess.CREATE_NO_WINDOW, msvcrt,
    # ctypes.wintypes, winaccent). On ubuntu-latest typeshed offers none of
    # them and reports ~35 false attr-defined errors (CI run 38548380226);
    # on the Windows dev host the same bare `mypy .` is clean. Run it where
    # the code is actually deployed.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install uv
      - run: uv sync --extra dev --extra analysis --extra cd-ripping
      - run: uv run mypy .

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Changed in 1.4.1: uv joins this job for the exported-lock audit below
      # (PLAN D96); bandit itself still runs from the installed package.
      - run: pip install uv "bandit[toml]"
      - name: Bandit (full tree)
        env:
          PYTHONUTF8: "1"
        # bandit exits 1 whenever ANY finding survives its default LOW/LOW
        # filter, so the raw exit code cannot express this project's gate.
        # The verdict is bandit's severity block: 0 High / 0 Medium (AGENTS.md),
        # the same rule utilities/run_gate.ps1 applies locally (plan D12).
        # Exit >= 2 (tool error) and a missing severity block fail loudly.
        run: |
          set +e
          bandit -r . -x ./.venv -c pyproject.toml > bandit-out.txt 2>&1
          code=$?
          set -e
          cat bandit-out.txt
          sev=$(sed -n '/Total issues (by severity):/,/Total issues (by confidence):/p' bandit-out.txt)
          if [ -z "$sev" ]; then
            echo "bandit severity block not found - failing loudly" >&2
            exit 2
          fi
          if printf '%s\n' "$sev" | grep -qE '^[[:space:]]*(High|Medium):[[:space:]]*[1-9]'; then
            echo "gate fail: severity block has High/Medium > 0" >&2
            exit 1
          fi
          if [ "$code" -ge 2 ]; then
            echo "bandit tool error (exit $code)" >&2
            exit "$code"
          fi
          echo "bandit gate pass: 0 High / 0 Medium (exit $code; Low findings accepted)"

      - name: Dependency audit (exported lock)
        shell: bash
        env:
          PYTHONUTF8: "1"
        # Changed in 1.4.1: added with PLAN D96, on probation for two sprints
        # (D2). The step reports but does not fail the job yet, so a newly
        # published advisory surfaces as a visible warning instead of blocking
        # unrelated work; flip continue-on-error to false when the probation
        # ends, and remove this flag then.
        #
        # Audit the *exported* graph, not .venv: the virtualenv also carries
        # environment-only packages (pip) that never ship, and their advisories
        # would drown the ones that matter. `--frozen` reads uv.lock, so the
        # audit judges exactly the graph CI installs, and `--no-deps` stops
        # pip-audit from re-resolving and drifting off that graph.
        continue-on-error: true
        run: |
          uv export --frozen --all-extras --no-emit-project \
            --format requirements-txt --no-hashes -o requirements-audit.txt
          uvx pip-audit -r requirements-audit.txt --no-deps --desc

  compile:
    name: Compile / Pre-flight gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -X utf8 -m compileall -q -f . -x '(^|/)(\.venv|\.git)/'

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor is 3.11 (see [project] requires-python): 3.10 could not
        # supply current numpy/scipy wheels, so it resolved a second, stale
        # numeric stack that nothing was developed against.  3.14 is the
        # interpreter the suite is actually developed and run on, so it is
        # tested rather than assumed.
        python-version: ["3.11", "3.12", "3.14"]
    steps:
      # fetch-depth: 0 is required by tests/test_release_notes.py, which runs
      # `git diff --name-only 0349d06` to enumerate the release's changed files;
      # the default shallow checkout has no history and would fail the lock.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install uv
      - run: uv sync --extra dev --extra analysis --extra cd-ripping
      - name: Install ffmpeg (Windows)
        run: choco install ffmpeg -y
      - name: Run test suite
        shell: bash
        env:
          PYTHONUTF8: "1"
        run: |
          uv run python -m pytest --tb=short -q \
            --cov --cov-report=term-missing --cov-fail-under=75
      - name: Export the recorded CLI payloads
        # Changed in 1.4.1: added with PLAN D103. The recordings are the
        # contract a script author programs against, so publish them where they
        # can be read without a checkout: one <command>.json per command, from
        # the same bytes the conformance gate validates.
        #
        # One matrix leg is enough, and it is the newest: the files come from the
        # committed corpus, so they are identical on every interpreter - this
        # step only formats and writes them.  If the version list above moves,
        # update this condition with it (tests/test_cli_schema_conformance.py
        # asserts the two agree, so a stale condition fails the suite).
        if: matrix.python-version == '3.14'
        shell: bash
        env:
          PYTHONUTF8: "1"
        run: uv run python -m tests.cli_schema_conformance --export-dir cli-payloads
      - uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.14'
        with:
          name: cli-payloads
          path: cli-payloads/
          # An empty artifact would look like success while telling a script
          # author nothing; fail the job instead.
          if-no-files-found: error
      - name: Build the documentation site
        # Changed in 2.1.0: added with PLAN_docs_consolidation P3.2. Until now
        # the docs were built only inside tests/test_docs_build.py's tempdir and
        # thrown away, so "the docs" could not be read without a checkout. The
        # suite gate still owns correctness (it fails on any parser warning);
        # this step publishes what that gate certified.
        #
        # One matrix leg is enough, and it is the newest: every page comes from
        # committed sources, so the HTML is identical on each interpreter.
        if: matrix.python-version == '3.14'
        shell: bash
        env:
          PYTHONUTF8: "1"
        # The index links each tool's guide as ../user_guides/..., i.e. the
        # path it has in the repository.  Copying the guide sources beside the
        # pages keeps those links working in the artifact instead of pointing
        # at a checkout the reader does not have (P3.3).
        run: |
          uv run python -m sphinx -b html -q docs docs/_build/html
          cp -r user_guides docs/_build/user_guides
      - uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.14'
        with:
          name: docs-html
          path: docs/_build/
          # A build that produced no pages would be a green step publishing
          # nothing; fail the job instead.
          if-no-files-found: error
      - name: Instruction locks, no user-global baseline (fixture path)
        shell: bash
        env:
          PYTHONUTF8: "1"
        # Changed in 1.1.0: added this step, so the runner proves the fixture
        # path instead of inheriting a developer host's real file.
        # The precedence contract AGENTS.md defers to rests on a user-global
        # instruction file that is not versioned here, so the live-file locks in
        # tests/test_agents_md.py read a fixture materialized from the committed
        # record in tests/data/external/ wherever no real baseline exists.
        # Pointing the home directory at an empty directory guarantees that
        # shape on a runner, and the step then asserts the run was skip-free: a
        # skip would mean part of the lock went unverified on the one host class
        # the fixture exists for. The collected counts are checked against
        # tests/data/lock_counts.json - generated from a passing run, not written
        # here - so a lock file cannot lose tests or double them without a
        # deliberate regeneration. The suite checks the same file, so this is not
        # a claim visible only on a runner. The precondition check fails loudly if a
        # baseline is somehow present, because then this step would prove
        # nothing, and `--no-cov` keeps the run out of the coverage data file.
        # The interpreter is invoked directly rather than through `uv run`:
        # uv keeps its cache under the home directory this step empties.
        run: |
          no_baseline="$(mktemp -d)"
          export HOME="$no_baseline" USERPROFILE="$no_baseline"
          py=.venv/Scripts/python.exe
          # True when no real baseline is reachable, i.e. the fixture path is live.
          absent='import sys; from tests.test_agents_md import GLOBAL_AGENTS;'
          absent="$absent sys.exit(1 if GLOBAL_AGENTS.is_file() else 0)"
          if ! "$py" -c "$absent"; then
            echo "gate fail: a baseline is reachable; the fixture path is not live" >&2
            exit 1
          fi
          log="$(mktemp)"
          "$py" -m pytest tests/test_agents_md.py \
            tests/test_external_records.py --tb=short -q -rs --no-cov \
            -p no:cacheprovider > "$log" 2>&1
          code=$?
          cat "$log"
          if [ "$code" -ne 0 ]; then
            exit "$code"
          fi
          if grep -qE "[0-9]+ skipped" "$log"; then
            echo "gate fail: a lock skipped without a baseline; the fixture is untested" >&2
            exit 1
          fi
          grep -qE "[0-9]+ passed" "$log" || {
            echo "gate fail: no tests ran" >&2
            exit 1
          }
          # Both bounds are enforced by the module, which also owns the counts:
          # a floor, and a cap one fifth above it so a module that doubled fails
          # while ordinary additions need no edit.
          if ! "$py" -m tests.lock_counts --check; then
            exit 1
          fi
          echo "instruction locks pass on the fixture path"

  schema-conformance:
    name: CLI schema conformance
    runs-on: ubuntu-latest
    # Changed in 1.4.1: added this job (PLAN D102). Every command publishes a
    # JSON payload, so the contract between a script and the tools is only as
    # good as the committed artifact: this validates one recorded payload per
    # command (tests/data/cli_payloads.json) against the committed
    # audio_suite_shared/cli_schema.json with the real draft 2020-12
    # validator a consumer uses, and fails if a command has no recording or a
    # recording no longer validates. Regenerate deliberately with
    # `python -m tests.cli_schema_conformance --record`.
    #
    # Deliberately dependency-light: the check imports only
    # audio_suite_shared.cli_schema (stdlib) and jsonschema, so it takes
    # seconds and cannot be hidden by a tool-dependency failure. If a future
    # edit imports tool code here, this job fails to import - which is the
    # signal to keep the check separate, not to install the world.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "jsonschema>=4.23"
      - name: Validate recorded payloads
        env:
          PYTHONUTF8: "1"
        run: python -m tests.cli_schema_conformance --check
