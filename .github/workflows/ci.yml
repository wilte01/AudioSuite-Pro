# AudioSuite-Pro continuous integration.
#
# Changed in 1.0.1: test job now runs on windows-latest only (Windows-only
# software), installs ffmpeg via choco for pydub audio export in tests,
# and checks out with fetch-depth: 0 for release notes enumeration.
# Removed ubuntu-latest from test matrix and Linux-specific system
# package installation steps.
# Changed in 1.0.1: simplified workflow header comments.
# Changed in 1.0.1: moved typecheck job to windows-latest (Windows-specific
# code uses Windows-only APIs and types).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  typecheck:
    name: Type Check
    # This project targets Windows: mypy's platform selection follows the
    # runner OS, and the suite legitimately uses Windows-only stdlib members
    # (ctypes.windll, os.startfile, subprocess.CREATE_NO_WINDOW, msvcrt,
    # ctypes.wintypes, winaccent). On ubuntu-latest typeshed offers none of
    # them and reports ~35 false attr-defined errors (CI run 38548380226);
    # on the Windows dev host the same bare `mypy .` is clean. Run it where
    # the code is actually deployed.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install uv
      - run: uv sync --extra dev --extra analysis --extra cd-ripping
      - run: uv run mypy .

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "bandit[toml]"
      - name: Bandit (full tree)
        env:
          PYTHONUTF8: "1"
        # bandit exits 1 whenever ANY finding survives its default LOW/LOW
        # filter, so the raw exit code cannot express this project's gate.
        # The verdict is bandit's severity block: 0 High / 0 Medium (AGENTS.md),
        # the same rule utilities/run_gate.ps1 applies locally (plan D12).
        # Exit >= 2 (tool error) and a missing severity block fail loudly.
        run: |
          set +e
          bandit -r . -x ./.venv -c pyproject.toml > bandit-out.txt 2>&1
          code=$?
          set -e
          cat bandit-out.txt
          sev=$(sed -n '/Total issues (by severity):/,/Total issues (by confidence):/p' bandit-out.txt)
          if [ -z "$sev" ]; then
            echo "bandit severity block not found - failing loudly" >&2
            exit 2
          fi
          if printf '%s\n' "$sev" | grep -qE '^[[:space:]]*(High|Medium):[[:space:]]*[1-9]'; then
            echo "gate fail: severity block has High/Medium > 0" >&2
            exit 1
          fi
          if [ "$code" -ge 2 ]; then
            echo "bandit tool error (exit $code)" >&2
            exit "$code"
          fi
          echo "bandit gate pass: 0 High / 0 Medium (exit $code; Low findings accepted)"

  compile:
    name: Compile / Pre-flight gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -X utf8 -m compileall -q -f . -x '(^|/)(\.venv|\.git)/'

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor is 3.11 (see [project] requires-python): 3.10 could not
        # supply current numpy/scipy wheels, so it resolved a second, stale
        # numeric stack that nothing was developed against.  3.14 is the
        # interpreter the suite is actually developed and run on, so it is
        # tested rather than assumed.
        python-version: ["3.11", "3.12", "3.14"]
    steps:
      # fetch-depth: 0 is required by tests/test_release_notes.py, which runs
      # `git diff --name-only 0349d06` to enumerate the release's changed files;
      # the default shallow checkout has no history and would fail the lock.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install uv
      - run: uv sync --extra dev --extra analysis --extra cd-ripping
      - name: Install ffmpeg (Windows)
        run: choco install ffmpeg -y
      - name: Run test suite
        shell: bash
        env:
          PYTHONUTF8: "1"
        run: |
          uv run python -m pytest --tb=short -q \
            --cov --cov-report=term-missing --cov-fail-under=75
      - name: Instruction locks, no user-global baseline (fixture path)
        shell: bash
        env:
          PYTHONUTF8: "1"
        # Changed in 1.1.0: added this step, so the runner proves the fixture
        # path instead of inheriting a developer host's real file.
        # The precedence contract AGENTS.md defers to rests on a user-global
        # instruction file that is not versioned here, so the live-file locks in
        # tests/test_agents_md.py read a fixture materialized from the committed
        # record in tests/data/external/ wherever no real baseline exists.
        # Pointing the home directory at an empty directory guarantees that
        # shape on a runner, and the step then asserts the run was skip-free: a
        # skip would mean part of the lock went unverified on the one host class
        # the fixture exists for. The collected counts are checked against
        # tests/data/lock_counts.json - generated from a passing run, not written
        # here - so a lock file cannot lose tests or double them without a
        # deliberate regeneration. The suite checks the same file, so this is not
        # a claim visible only on a runner. The precondition check fails loudly if a
        # baseline is somehow present, because then this step would prove
        # nothing, and `--no-cov` keeps the run out of the coverage data file.
        # The interpreter is invoked directly rather than through `uv run`:
        # uv keeps its cache under the home directory this step empties.
        run: |
          no_baseline="$(mktemp -d)"
          export HOME="$no_baseline" USERPROFILE="$no_baseline"
          py=.venv/Scripts/python.exe
          # True when no real baseline is reachable, i.e. the fixture path is live.
          absent='import sys; from tests.test_agents_md import GLOBAL_AGENTS;'
          absent="$absent sys.exit(1 if GLOBAL_AGENTS.is_file() else 0)"
          if ! "$py" -c "$absent"; then
            echo "gate fail: a baseline is reachable; the fixture path is not live" >&2
            exit 1
          fi
          log="$(mktemp)"
          "$py" -m pytest tests/test_agents_md.py \
            tests/test_external_records.py --tb=short -q -rs --no-cov \
            -p no:cacheprovider > "$log" 2>&1
          code=$?
          cat "$log"
          if [ "$code" -ne 0 ]; then
            exit "$code"
          fi
          if grep -qE "[0-9]+ skipped" "$log"; then
            echo "gate fail: a lock skipped without a baseline; the fixture is untested" >&2
            exit 1
          fi
          grep -qE "[0-9]+ passed" "$log" || {
            echo "gate fail: no tests ran" >&2
            exit 1
          }
          # Both bounds are enforced by the module, which also owns the counts:
          # a floor, and a cap one fifth above it so a module that doubled fails
          # while ordinary additions need no edit.
          if ! "$py" -m tests.lock_counts --check; then
            exit 1
          fi
          echo "instruction locks pass on the fixture path"
