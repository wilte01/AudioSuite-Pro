# Changed in 1.0.1: bumped [project] version 1.0.0 -> 1.0.1 (first maintenance
# release; PLAN_bughunt_remediation.md G8.4). This is the single source of truth
# for the suite version (audio_suite_shared/project_version.py reads it).
# Changed in 1.1.0: bumped [project] version 1.0.1 -> 1.1.0 (Sprint 1 feature
# release - extended format support + optional DSP effects;
# PLAN_feature_expansion.md D26).
# Changed in 1.2.0: bumped [project] version 1.1.0 -> 1.2.0 (Sprint 2 feature
# release - MusicBrainz integration, AccurateRip confidence/re-rip, ISRC
# submission; PLAN_feature_expansion.md D36).
# Changed in 1.3.0: declares matplotlib as a real dependency (Sprint 3, D37).
# It was never declared, yet library_stats already imported it for its Charts
# tab, so every fresh install rendered a "matplotlib not installed" message
# instead of charts and the chart code was untested.
# Changed in 1.3.0: bumped [project] version 1.2.0 -> 1.3.0 (Sprint 3 feature
# release - spectral viewer, cached-scan performance, completeness heatmap and
# trend history; PLAN_feature_expansion.md D49).
# Changed in 1.4.1: adds jsonschema to the dev extra, so the CLI
# schema-conformance gate validates the committed payload corpus against the
# committed schema document with a real draft 2020-12 validator instead of a
# hand-rolled subset (PLAN_feature_expansion.md D102).
# Changed in 1.4.1: raises the urllib3 floor to 2.8.0, the fix for the three
# PYSEC advisories the new dependency audit reports against 2.7.0, and adds
# pip-audit to the dev extra so the same scan runs locally (PLAN D96).
# Changed in 1.4.1: ships audio_suite_shared/cli_schema.json as package data,
# so `--json-schema` can print the committed document - examples included -
# from a wheel install rather than only from a checkout (PLAN D104).

[build-system]
# setuptools >= 77 is required by the PEP 639 metadata below: the SPDX
# `license` string and `license-files` forms are only parsed from that
# version on. Verified empirically via the install path (uv sync), not by
# reading docs (plan E2).
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "audiosuite-pro"
version = "1.4.1"
readme = "README.md"
requires-python = ">=3.11"
# Plan iteration 5 E2 (audit #11), decision D1: GPL-3.0, chosen because the
# heaviest first-party dependency (pedalboard) is GPL-3.0 and the rejected
# analysis engines (essentia=AGPL, madmom's models=CC BY-NC-SA) constrain a
# permissive grant anyway. See LICENSE (verbatim GNU GPL v3 text).
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = [
    "certifi>=2021.5.30",
    "click>=8.0.0",
    "cryptography>=3.4.8",
    "librosa>=0.10.0",
    "matplotlib>=3.8",
    "mutagen>=1.46.0",
    "numpy>=1.21.0",
    "pedalboard>=0.9.23",
    "Pillow>=9.0.0",
    "pydub>=0.25.0",
    "scipy>=1.7.0",
    "sounddevice>=0.4.0",
    "requests>=2.28.0",
    # 2.8.0 is the fix for PYSEC-2026-4175/-4176/-4177 (TLS proxy context
    # confusion, chunked/deflate streaming loops). CI's exported-lock audit and
    # tests/test_ci_security_audit.py keep the resolver from drifting back
    # below this floor.
    "urllib3>=2.8.0",
    "winaccent>=1.0.0; sys_platform == 'win32'",
    "audioop-lts>=0.2.0 ; python_full_version >= '3.13'",
]

[project.scripts]
audiosuite = "audio_suite_shared.cli_app:cli"

# External system requirement (plan A5, audit #6): ffmpeg is invoked from 35
# production files but is a binary, not a Python package, so it belongs here as
# a declaration, not in dependencies.  Machine-readable source of truth:
# audio_suite_shared/system_requirements.py (probed at launch by preflight).
# ffmpeg + ffprobe must be on PATH: winget install Gyan.FFmpeg / brew install
# ffmpeg / sudo apt install ffmpeg.

[project.optional-dependencies]
cd-ripping = [
    "discid>=1.2.0",
    "musicbrainzngs>=0.7.1",
]
analysis = [
    "librosa>=0.10.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "coverage>=7.0.0",
    "ruff>=0.5.0",
    "mypy>=1.0.0",
    "bandit[toml]>=1.7.0",
    # Dev-only: audits the exported lock (what ships), not the virtualenv.
    "pip-audit>=2.10.0",
    # Dev-only: the schema-conformance gate validates the committed artifact the
    # way an external consumer does.  No shipped path imports it.
    "jsonschema>=4.23.0",
    "python-docx>=1.1.0",
    "python-pptx>=1.0.0",
    "types-requests>=2.28.0",
    # Dev-only: tests/test_docs_build.py builds docs/ with Sphinx and fails on
    # any parser warning, so a malformed docstring cannot reach the API
    # reference (PLAN_feature_expansion P2).  D98 kept the docs toolchain out
    # of dev because nothing parsed docstrings; the gate is that nothing.
    "sphinx>=8.2",
]

[tool.bandit]
# B404 (import subprocess) is skipped by policy: the import itself carries no
# execution risk.  Actual subprocess invocation is still audited via B603
# (subprocess_without_shell_equals_true), B607 (start_process_with_partial_path)
# and B608 (hardcoded_sql_expressions), and all first-party invocations go
# through run_secure_subprocess() in audio_suite_shared/secure_subprocess.py.
# B101 (assert_used) is skipped: the suite's asserts are test/build-time
# invariants, not runtime authorization checks.  Production code paths that
# must raise do so via explicit exception raising, not asserts.
skips = ["B404", "B101"]
exclude_dirs = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
# Third-party packages that ship py.typed but contain untyped defs:
# calling into them must not trip --strict's disallow_untyped_calls.
untyped_calls_exclude = [
    "mutagen",
    "numpy",
    "scipy",
    "PIL",
    "pedalboard",
    "librosa",
    "pydub",
    "sounddevice",
    "discid",
    "musicbrainzngs",
    "cryptography",
    "winaccent",
    "matplotlib",
    "matplotlib.backends.backend_tkagg",
    # typeshed gap: ttk.Notebook.tab/select stubs are themselves untyped
    "tkinter",
]
exclude = [
    "^tests/",
    "^user_guides/",
    "/tests/",
]

[[tool.mypy.overrides]]
module = [
    "pedalboard.*",
    "pydub.*",
    "sounddevice.*",
    "librosa.*",
    "scipy.*",
    "mutagen",
    "mutagen.*",
    "mutagen.id3",
    "mutagen.id3.*",
    "mutagen.mp3",
    "mutagen.mp3.*",
    "mutagen.mp4",
    "mutagen.mp4.*",
    "mutagen.flac",
    "mutagen.oggvorbis.*",
    "discid.*",
    "musicbrainzngs.*",
    "PIL.*",
    "PIL.Image.*",
    "winaccent.*",
    "cryptography.*",
    "numpy.*",
    "numpy.typing.*",
]
ignore_missing_imports = true
disallow_untyped_calls = false
implicit_reexport = true

# pedalboard ships py.typed but re-exports Pedalboard & friends from its
# __init__ without an explicit __all__; allow its implicit re-exports so
# `from pedalboard import Pedalboard` type-checks under --strict.
[[tool.mypy.overrides]]
module = "pedalboard"
implicit_reexport = true

# matplotlib's backend modules re-export their canvas/toolbar classes through an
# __init__-style module that does not list them in __all__, so under --strict
# `from matplotlib.backends.backend_tkagg import NavigationToolbar2Tk` reports
# "does not explicitly export attribute". Allow the implicit re-exports, listing
# each bare module name alongside the globs: a glob like `matplotlib.*` does not
# match `matplotlib` itself.
[[tool.mypy.overrides]]
module = [
    "matplotlib",
    "matplotlib.*",
    "matplotlib.backends",
    "matplotlib.backends.backend_tkagg",
]
implicit_reexport = true

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
# Session D3 hardening: the E/F/I baseline misses assertions that can never
# fail and a set of null-flow shapes that shell-string drafting produced.
# The B (bugbear) and PLW subsets below were triaged on the full suite at
# adoption; anything here must either be fixed or explicitly recorded as
# policy per conflict with an existing accepted shape.
select = [
    "E",
    "W",
    "F",
    "I",
    "B005",  # duplicate .strip/.split arg: masks intent, never correct
    "B006",  # mutable default argument (dataclass arg dicts)
    "B008",  # call in default arg other than well-known patterns
    "B011",  # `assert False` shipped as flow control
    "B015",  # pure comparison statement that does nothing
    "B018",  # useless attribute/class access statement
    "B017",  # assertRaises(Exception): too broad in test settings
    "B018",  # (duplicate guard removals handled by ruff itself)
    "B024",  # ABC without abstract methods
    "B025",  # duplicate base classes
    "B026",  # fn keyword only arg used as positional in star form
    "B027",  # empty method in interface/class
    "B028",  # warnings.warn without stacklevel
    "B032",  # unintended f-string cast
    "PLW0120",  # useless else-on-loop slot
    "PLW0127",  # self-assignment
    "PLW0129",  # assert on a string literal
    "PLW0131",  # named-expression reuse leak
]
unfixable = []
ignore = []

[tool.pytest.ini_options]
testpaths = [
    "tests",
    "album_art_normalizer/tests",
    "album_art_sync/tests",
    "album_genre_tagger/tests",
    "asx_extractor/tests",
    "audio_enhancer/tests",
    "audio_fingerprinter/tests",
    "audio_normalizer/tests",
    "audio_refinery/tests",
    "audio_suite_shared/tests",
    "bpm_analyzer/tests",
    "cd_ripper/tests",
    "file_reorganizer/tests",
    "genre_sync/tests",
    "key_detector/tests",
    "library_stats/tests",
    "lyrics_manager/tests",
    "master_driver/tests",
    "metadata_scrubber/tests",
    "mood_analyzer/tests",
    "mood_analysis_batch_tagger/tests",
    "noise_reduction/tests",
    "music_format_converter/tests",
    "pop_click_remover/tests",
    "replaygain_analyzer/tests",
    "silence_trimmer/tests",
    "spectral_viewer/tests",
    "tag_editor/tests",
    "tag_field_updater/tests",
    "tempo_analyzer/tests",
    "utilities/tests",
]
markers = [
    "integration: marks tests that require ffmpeg and real audio files. They run by default wherever ffmpeg/ffprobe are found (CI installs ffmpeg, plan A4); where a binary is missing the root conftest auto-skips each integration test with a reason naming the missing executable.",
    "hardware: marks tests that require physical CD drive hardware and the Win32 drive API. They are deselected by default (addopts runs pytest -m \"not hardware\") and never run in CI; the documented opt-in is `pytest -m hardware` (CONTRIBUTING, plan E2).",
    "gui: marks tests that genuinely require a graphical display. Skipped with an attributable reason on a headless host; for tests that need a real Tk root without using the shared root/tk_root fixture.",
]
addopts = '--strict-markers -ra -m "not hardware" --cov --cov-report=term-missing'
filterwarnings = [
    # pydub 0.25.1 (latest on PyPI) ships lazy invalid-escape regexes in
    # utils.py that emit SyntaxWarning on Python 3.14 — otherwise masked
    # only by __pycache__. Scoped to pydub so first-party warnings stay
    # visible; remove once upstream fixes the regexes.
    "ignore::SyntaxWarning:pydub.*",
    # librosa emits benign warnings when analysing very short audio fixtures
    # (n_fft too large for the signal length, empty pitch estimation set, and
    # the deprecated audioread backend fallback).  All three fire only from
    # short synthetic test clips and do not indicate a real problem.
    "ignore::FutureWarning:librosa.*",
    "ignore:PySoundFile failed.*:UserWarning",
    "ignore:.*n_fft.*is too large.*:UserWarning",
    "ignore:.*estimate tuning from empty.*:UserWarning",
    # audioread (transitive via librosa) imports removed stdlib modules on
    # Python >= 3.13; the installed 'standard-aifc'/'standard-sunau' backports
    # work fine — suppress until upstream patches.
    "ignore::DeprecationWarning:audioread.*",
]

[tool.coverage.run]
source = [
    "audio_suite_shared",
    "album_art_normalizer",
    "album_art_sync",
    "album_genre_tagger",
    "asx_extractor",
    "audio_enhancer",
    "audio_fingerprinter",
    "audio_normalizer",
    "audio_refinery",
    "bpm_analyzer",
    "cd_ripper",
    "file_reorganizer",
    "genre_sync",
    "key_detector",
    "library_stats",
    "lyrics_manager",
    "master_driver",
    "metadata_scrubber",
    "mood_analyzer",
    "mood_analysis_batch_tagger",
    "noise_reduction",
    "music_format_converter",
    "pop_click_remover",
    "replaygain_analyzer",
    "silence_trimmer",
    "spectral_viewer",
    "tag_editor",
    "tag_field_updater",
    "tempo_analyzer",
    "utilities",
]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
fail_under = 75
show_missing = true
exclude_lines = [
    # Standard pragmas
    "pragma: no cover",
    # Type-checking-only code never runs at runtime
    "if TYPE_CHECKING:",
    # Abstract / protocol stubs are exercised via concrete implementations
    "@abstractmethod",
    "raise NotImplementedError",
    # Protocol/ABC placeholder bodies
    "^\\s*\\.\\.\\.\\s*$",
    # Script entry points covered by CLI tests instead
    'if __name__ == "__main__":',
]

[tool.ruff.format]
quote-style = "double"
# Plan A1 (audit #1): never format Markdown.  Ruff formats Python code blocks
# inside .md files, so the completed PLAN_*.md records are part of the tree and
# a documentation file would fail the project-wide format gate — and running
# `ruff format .` to "fix" it would rewrite a historical plan's content.  This
# must stay a `format.exclude` entry and NOT the CLI form `--exclude "*.md"`:
# the CLI form REPLACES Ruff's built-in exclusions instead of adding to them,
# which re-admits .venv.  Verified empirically against ruff 0.15.22.
# Changed in 1.4.0: bumped [project] version 1.3.0 -> 1.4.0
# (release cut by utilities/release.py).
exclude = ["*.md"]

[tool.setuptools.packages.find]
where = ["."]
exclude = [
    "*.tests",
    "*.tests.*",
    "tests",
    "tests.*",
]

# `--json-schema` prints the shipped document, so a wheel without it would
# fail at that flag; .json is not a Python module, so setuptools needs the file
# named here.  tests/test_cli_json_schema.py locks the entry.
[tool.setuptools.package-data]
audio_suite_shared = ["cli_schema.json"]
# Shipped pipeline defaults; the live file lives in ~/.audiosuite (PLAN D101).
# Changed in 1.4.1: bumped [project] version 1.4.0 -> 1.4.1
# (release cut by utilities/release.py).
audio_refinery = ["refinery_settings.default.json"]
